<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="calculator">
        <div class="topline">
          <span>MY CALCULATOR</span><span class="dot"></span>
        </div>
        <h1>Calculator</h1>
        <p class="subtitle">A simple tool for everyday calculations.</p>
        <div class="screen">
          <div id="previous" class="previous" aria-live="polite"></div>
          <div id="display" class="display" aria-live="polite">0</div>
        </div>
        <div class="keys">
          <button class="utility" data-action="clear">AC</button>
          <button class="utility" data-action="delete">DEL</button>
          <button class="operator" data-operator="/">÷</button>
          <button class="operator" data-operator="*">×</button>
          <button data-number="7">7</button><button data-number="8">8</button
          ><button data-number="9">9</button
          ><button class="operator" data-operator="-">−</button>
          <button data-number="4">4</button><button data-number="5">5</button
          ><button data-number="6">6</button
          ><button class="operator" data-operator="+">+</button>
          <button data-number="1">1</button><button data-number="2">2</button
          ><button data-number="3">3</button
          ><button class="equals" data-action="equals">=</button>
          <button class="zero" data-number="0">0</button
          ><button data-action="decimal">.</button>
        </div>
        <p class="hint">Tip: You can also use your keyboard.</p>
      </section>
    </main>
  </body>
</html>
